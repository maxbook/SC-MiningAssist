name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw),'(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo.toml.' }
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Check source
        run: |
          ./build.ps1 -Format
          ./build.ps1 -Lint
          ./build.ps1 -Test
          ./scripts/update-notices.ps1
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate dependency notices.' }
      - name: Build and verify portable archive
        run: ./scripts/package.ps1
      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $archive = Get-ChildItem dist/SC-MiningAssist-v*-win64.zip | Select-Object -ExpandProperty FullName
          gh release create "$env:GITHUB_REF_NAME" "$archive" dist/SHA256SUMS.txt --verify-tag --draft --prerelease --title "SC-MiningAssist $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed. Check for an existing release before rerunning.' }
