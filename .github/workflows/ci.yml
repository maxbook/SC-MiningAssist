name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Formatting
        run: ./build.ps1 -Format
      - name: Clippy
        run: ./build.ps1 -Lint
      - name: Unit tests
        run: ./build.ps1 -Test
      - name: Verify dependency notices
        run: |
          ./scripts/update-notices.ps1
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Regenerate dependency notices.' }
      - name: Build and verify portable archive
        run: ./scripts/package.ps1
      - name: Upload portable preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MiningMod-win64
          path: |
            dist/MiningMod-v*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
